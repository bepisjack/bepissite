<!DOCTYPE html>
<body onload="getData()">
<style>
body {background-color: black;
}

.data {
    color: green;
}

</style>




<script>
    
      async function getData() {
    try {
        const response = await fetch('https://bepisbackend.fly.dev/commits');  // Call your backend endpoint
        
        if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
        }

        const commitCount = await response.json();
        document.getElementById("commits").innerText = "ver 1." + commitCount;
    } catch (error) {
        console.error(error.message);
    }
}

      async function getData() {
    try {
        const response = await fetch('https://bepisbackend.fly.dev/pagecount');  // Call your backend endpoint
        
        if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
        }

        const pagesCount = await response.json();
        document.getElementById("pagescount").innerText = "pages: " + pagesCount;
    } catch (error) {
        console.error(error.message);
    }
}



</script>

<div class="data" id="commits">..</div>
<br>
<div class="data" id="pagescount">..</div>







</body>
