<!DOCTYPE html>
<style>

.riddle {
    width: 40vw;
margin:auto;
display: flex;
align-content: center;

z-index: 1;
}


html {
  padding: 0;
  margin: 0;
  background-color:rgba(0,0,0,1.00);
	color:rgba(255,255,255,1.00);
  overflow: hidden;
}

body * {
  z-index: 20;
  color: rgba(0,0,0,1.00);
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

#content {
  width: 100%;
  height: 100vh;
}

#light {
  position: fixed;
  width: 400vw;
  height: 400vh;
  background: rgba(0,0,0,1);
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%, -50%);
}

#light.light-on {
     background: radial-gradient(circle 110px at center, transparent 0%, rgba(0,0,0,0.995) 100%);
 
}

.pogi {
  position: absolute;
  top: 40%;
  left: 45%;
}

</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    
$(document).ready(function() {
  $(this).mousemove(function(e) {
    $("#light").css({
      "top": e.pageY,
      "left": e.pageX,
    })
  }).mousedown(function(e) {
    if (e.which === 1) {
            $("#light").toggleClass("light-on");
    }
  });
})

$(document).on("contextmenu", function(e) {
    return false; // Blocks the right-click menu
});
</script>


<body>
<div id="light"></div>

    <br>  <br>
<img class="riddle" src="/puzzle.png">




</body>
