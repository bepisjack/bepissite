<script>

      var bgm = new Howl({
        src: ['/pokemongate.mp3'],
        loop: true,
        volume: 0,
          });
      bgm.play();
      bgm.fade(0, 0.2, 4000);


document.addEventListener('DOMContentLoaded', () => {

    document.addEventListener('click', () => {
    if (Howler.ctx && Howler.ctx.state === 'suspended') {
        Howler.ctx.resume();
    }
}, { once: true });

const clicksound1 = new Howl({
    src: ['/wiiselect.wav'],
    volume: 0.1,
});

const clicksound2 = new Howl({
    src: ['/wiihover2.wav'],
    volume: 0.1,
});


const channels = document.querySelectorAll('.wiiborder');

channels.forEach(button => {
    button.addEventListener('click', function() {
     clicksound1.play();
    });
});
channels.forEach(button => {
    button.addEventListener('mouseover', function() {
     clicksound2.play();
    });
});

});
</script>
