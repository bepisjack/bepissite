@font-face {

img {

.wiicontainer {
    position: relative;

.beerpic {
    position: absolute;
 
    z-index: 1;

.wiiborder {
    position: absolute;
    max-width: 100%;
    z-index: 2;
    transition: 0.1s ease-in-out;
    cursor: url(/wii2.cur), pointer;
}


.wiiborder:hover {
    box-shadow: inset 0 0 20px 15px rgb(82, 200, 255);

.hover-text {
    display: none;
    opacity: 0;
    position: absolute;
    font-size: 30pt;
    font-family: wii;
    color: rgb(82, 82, 82);
    padding: 4px;
    padding-left: 40px;
    padding-right: 40px;
    width: max-content;
    box-sizing: border-box;
    top: 120%;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    text-align: center;
    z-index: 9;
    background-color: rgb(255, 255, 255);
    border-color: rgb(120, 120, 120);
    border-style: solid;
    border-radius: 45px;
    box-shadow: 2px 2px 2px rgb(40, 40, 40);
    transition: display 0.1s allow-discrete, opacity 0.1s ease-out, transform 0.1s ease-out;
    
}

.wiicontainer:hover .hover-text {
    display: block;
        z-index: 5;
            transform: translateX(-50%) scale(1);
        opacity: 1;
@starting-style {

<script>

      var bgm = new Howl({
        src: ['/pokemongate.mp3'],
        loop: true,
        volume: 0,
          });
      bgm.play();
      bgm.fade(0, 0.2, 4000);


document.addEventListener('DOMContentLoaded', () => {

    document.addEventListener('click', () => {
    if (Howler.ctx && Howler.ctx.state === 'suspended') {
        Howler.ctx.resume();
    }
}, { once: true });

const clicksound1 = new Howl({
    src: ['/wiiselect.wav'],
    volume: 0.1,
});

const clicksound2 = new Howl({
    src: ['/wiihover2.wav'],
    volume: 0.1,
});


const channels = document.querySelectorAll('.wiiborder');

channels.forEach(button => {
    button.addEventListener('click', function() {
     clicksound1.play();
    });
});
channels.forEach(button => {
    button.addEventListener('mouseover', function() {
     clicksound2.play();
    });
});

});
</script>
