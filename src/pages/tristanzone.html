    $(document).ready(function() {
  $(this).mousemove(function(e) {
    $("#light").css({
      "top": e.pageY,
      "left": e.pageX,
    })
  }).mousedown(function(e) {
    if (e.which === 1) {
            $("#light").toggleClass("light-on");
    }
  });
})

$(document).on("contextmenu", function(e) {
    return false; // Blocks the right-click menu
});

<script>

function updateClock () {
    const now = new Date();
    document.getElementById('time').innerHTML = now.toLocaleTimeString('en-US', {hourCycle:"h24", weekday:"long"});
}

setInterval(updateClock, 1000);



      var bgm = new Howl({
        src: ['/pokemongate.mp3'],
        loop: true,
        volume: 0,
          });
      bgm.play();
      bgm.fade(0, 0.2, 4000);

      
      var bgm2 = new Howl({
        src: ['/nationalpark.mp3'],
        loop: true,
        volume: 0,
          });
 

 document.addEventListener('click', () => {
    if (Howler.ctx && Howler.ctx.state === 'suspended') {
        Howler.ctx.resume();
    }
}, { once: true });



const clicksound1 = new Howl({
    src: ['/wiiselect.wav'],
    volume: 0.1,
});

const clicksound2 = new Howl({
    src: ['/wiihover2.wav'],
    volume: 0.1,
});

const clicksound3 = new Howl({
    src: ['/lebronjames.mp3'],
    volume: 0.04,
});


const button2 = document.getElementById('lebronbutton');

button2.addEventListener('mouseover', function() {
    clicksound2.play();
});


button2.addEventListener('click', function() {
    clicksound3.play();
    bgm.stop();
    bgm2.stop();
 bgm2.play();
    bgm2.fade(0, 0.2, 6000);

    });
   
const channels = document.querySelectorAll('.wiiborder');

const backbutton = document.getElementById('backbutton');

backbutton.addEventListener('mouseover', function() {
    clicksound2.play();
});


channels.forEach(button => {
    button.addEventListener('click', function() {
     clicksound1.play();
    });
});
channels.forEach(button => {
    button.addEventListener('mouseover', function() {
     clicksound2.play();
    });
});

document.addEventListener("visibilitychange", function() {
if (document.hidden) {

    bgm.pause();
    bgm2.pause();
} else {
        bgm.play();
          bgm.fade(0, 0.2, 4000); 
    }
});


updateClock();
</script>
