const loadusername = async function() {
    try {
   const response = await fetch('https://api.bepisesports.com/accounts/me', {
    credentials: 'include'
    });

    if (!response.ok) {
            document.getElementById('usernameblank').innerText = "not logged in!!";
            document.getElementById('loginButton').style.display = 'block';
            document.getElementById('registerButton').style.display = 'block';
            document.getElementById('balanceDisplay').innerText = "0 bepiscoin";

            return;
        }

    const data = await response.json();

    if (data && data.username) {
        document.getElementById('usernameblank').innerText = data.username;
        document.getElementById('bettorusername').value = data.username;
        document.getElementById('logoutButton').style.display = 'block';
         document.getElementById('submitButton').style.display = 'block';
    } else {
        document.getElementById('usernameblank').innerText = "not logged in!";
        document.getElementById('balanceDisplay').innerText = "0 bepiscoin";
    }

      }
    catch (error) {
        console.error("Error fetching data", error);
    }
}

const loadBalance = async () => {
    const response = await fetch('https://api.bepisesports.com/accounts/balances', {
        credentials: 'include'
    });
    if (response.ok) {
        const data = await response.json();
        document.getElementById('balanceDisplay').innerText = `${data.currency} bepiscoin`;
        const wagerInput = document.getElementById('quantityInput');
        wagerInput.max = data.currency;
    }
};

const handleLogout = async () => {
    const response = await fetch('https://api.bepisesports.com/accounts/logout', {
        method: 'POST',
        credentials: 'include'
    });
    if (response.ok) {
        window.location.href = 'https://bepisesports.com/bepisracetests';
    } else {
        alert("logout failed");
    }
};

document.addEventListener('DOMContentLoaded', () => {
    loadusername();
    loadBalance();
});   


function enforceMax(inputElement) {
  // Get the current value and the max limit
  const maxValue = parseFloat(inputElement.getAttribute('max'));
  const currentValue = parseFloat(inputElement.value);

  // If the current value is greater than the max, set it to the max
  if (currentValue > maxValue) {
    inputElement.value = maxValue;
  }
}
function incrementValue() {
  const inputElement = document.getElementById("quantityInput");
  // stepUp() increments the value by the 'step' attribute value (defaults to 1)
  inputElement.stepUp(); 
}
function incrementValue2() {
  const inputElement = document.getElementById("quantityInput");
  // stepUp() increments the value by the 'step' attribute value (defaults to 1)
  inputElement.stepDown(); 
}

async function submitBet() {
    const statusDiv = document.getElementById('statusDiv');
    statusDiv.className = '';
  
    const betData = {
        quantity: document.getElementById('quantityInput').value,
        selection: document.getElementById('favored').value,
        username: document.getElementById('bettorusername').value
    };

try {
    const response = await fetch ('https://api.bepisesports.com/accounts/placebet', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(betData)
    });

    const result = await response.json();

    if (response.ok) {
        loadBalance();
        statusDiv.innerText = result.message;
        statusDiv.classList.add('errorAnimation');
                       statusDiv.classList.add('successMessage');
      document.getElementById('quantityInput').value = "0";
    } else {
        statusDiv.innerText = result.error;

                statusDiv.classList.add('errorAnimation');
            statusDiv.classList.add('errorMessage'); 
    }
} catch (err) {
    statusDiv.innerText = "server error !";
            statusDiv.classList.add('errorAnimation');
                    statusDiv.classList.add('errorMessage');
    }

}
