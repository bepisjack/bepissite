<!DOCTYPE html>
<body>

<div id="usernameblank"></div>
<div id="balanceDisplay"></div>

<script>

const loadusername = async function() {
    try {
   const response = await fetch('https://api.bepisesports.com/accounts/me', {
    credentials: 'include'
    });

    if (!response.ok) {
            document.getElementById('usernameblank').innerText = "Not Logged In!";
            return;
        }

    const data = await response.json();

    if (data && data.username) {
        document.getElementById('usernameblank').innerText = data.username;
    } else {
        document.getElementById('usernameblank').innerText = "Not Logged In!";
    }

    const username = data.username;

    document.getElementById('usernameblank').innerText = username;

      }
    catch (error) {
        console.error("Error fetching data", error);
    }
}

const loadBalance = async () => {
    const response = await fetch('https://api.bepisesports.com/accounts/balances', {
        credentials: 'include'
    });
    if (response.ok) {
        const data = await response.json();
        document.getElementById('balanceDisplay').innerText = `${data.currency} bepiscoin`;
    }
};


document.addEventListener('DOMContentLoaded', () => {
    loadusername();
    loadBalance();
});   

</script>
</body>
