<!DOCTYPE html>
<style>

.usernamespot {
    background-image: linear-gradient(-90deg, red, orange);
    width: 350px;
    height: 40px;
font-size: 24pt;
clip-path: polygon(00% 00%,
  100% 00%,
  85% 100%,
  00% 100%);
  left: -3vw;
  top: 2vh;
  position:fixed;
}

.currencyspot {
    background-image: linear-gradient(-90deg, red, orange);
    width: 300px;
    height: 28px;
font-size: 16pt;
clip-path: polygon(00% 00%,
  100% 00%,
  88% 100%,
  00% 100%);
  left: -6vw;
  top: 7.5vh;
  position:fixed;
}


#usernameblank {
    color:white;
    text-shadow: 2px 2px 2px black;
    text-align: center;
transform: translate(3%, 0%);
}

#balanceDisplay {
    color:white;
    text-shadow: 2px 2px 2px black;
    text-align: center;
transform: translate(12%, 5%);
}

#logoutButton {
    bottom: 2vh;
    right: 1.5vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 0px red;
    height: 22px;
    width: 60px;
    display: none;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
}

#logoutButton:hover {
    background-color: rgb(214, 77, 52);
    transform: scale(1.1);
}

#loginButton {
    bottom: 2vh;
    right:  6vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 0px rgb(29, 230, 224);
    height: 22px;
    width: 54px;
    display: none;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
}

#loginButton:hover {
       background-color:darkcyan;
    transform: scale(1.1);

}

#registerButton {
    bottom: 2vh;
    right: 1.5vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 0px rgb(29, 230, 224);
    height: 22px;
    width: 70px;
    display: none;
    cursor: pointer;
    transition: transform 0.1s ease, 0.2s background-color ease;
}

#registerButton:hover {
    background-color:darkcyan;
    transform: scale(1.1);
}

.shadowcontainer {
    position: fixed;
    width: 0;
    height: 0;
    z-index: 100;
    filter: drop-shadow(5px 5px 4px rgba(0, 0, 0, 0.6));
}

body {
     background: url(/moneybackground.png), rgba(0, 0, 0, 0.616);
    background-blend-mode: multiply;
}

#back {
    bottom: 2vh;
    left: 1vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 0px red;
    height: 22px;
    width: 60px;
    display: block;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.3s ease;
}

#back:hover {
    background-color: rgb(214, 77, 52);
    transform: scale(1.1);
}

#errorMessage {
font-size: 40pt;
margin: auto;
text-align: center;
color: white;
text-shadow: 2px 2px 10px rgb(240, 92, 0), 2px 2px 2px rgb(240, 92, 0);
animation-name: errorAnimation;
animation-duration: 4s;
animation-fill-mode: forwards;
animation-timing-function: ease;


}

@keyframes errorAnimation {
    0% {transform: translateY(-300px)}
    10% {transform: translateY(0px)}
    14% {transform: rotate(4deg)}
    19% {transform: rotate(-4deg)} 
    23% {transform: rotate(2deg)}  
    28% {transform: rotate(0deg)}  
    60% {transform: translateY(0px)}
    80% {transform: translateY(-300px)}
    100% {transform: translateY(-301px)}
}

</style>
<body>

<div class="shadowcontainer">
<div class="usernamespot">
<div id="usernameblank"></div>
</div>
</div>

<div class="shadowcontainer">
<div class="currencyspot">
<div id="balanceDisplay"></div>
</div>
</div>

<form action="https://api.bepisesports.com/accounts/logout" method="POST">
<button id="logoutButton" onclick="handleLogout()">logout!</button>

</form>
<a href="/racelogin">
    <button id="loginButton">login!!</button>
</a>

<a href="/raceregister">
    <button id="registerButton">register!!</button>
</a>

<a href="https://bepisesports.com/">
    <button id="back">> back</button>
</a>

<br>
<div id="errorMessage" style="display: none;">you are logged out!</div>

<script>

const loadusername = async function() {
    try {
   const response = await fetch('https://api.bepisesports.com/accounts/me', {
    credentials: 'include'
    });

    if (!response.ok) {
            document.getElementById('usernameblank').innerText = "not logged in!!";
            document.getElementById('loginButton').style.display = 'block';
            document.getElementById('registerButton').style.display = 'block';
            document.getElementById('balanceDisplay').innerText = "0 bepiscoin";
            return;
        }

    const data = await response.json();

    if (data && data.username) {
        document.getElementById('usernameblank').innerText = data.username;
        document.getElementById('logoutButton').style.display = 'block';
    } else {
        document.getElementById('usernameblank').innerText = "not logged in!";
        document.getElementById('balanceDisplay').innerText = "0 bepiscoin";
    }

    const username = data.username;

    document.getElementById('usernameblank').innerText = username;

      }
    catch (error) {
        console.error("Error fetching data", error);
    }
}

const loadBalance = async () => {
    const response = await fetch('https://api.bepisesports.com/accounts/balances', {
        credentials: 'include'
    });
    if (response.ok) {
        const data = await response.json();
        document.getElementById('balanceDisplay').innerText = `${data.currency} bepiscoin`;
    }
};

const handleLogout = async () => {
    const response = await fetch('https://api.bepisesports.com/accounts/logout', {
        method: 'POST',
        credentials: 'include'
    });
    if (response.ok) {
        window.location.href = 'https://bepisesports.com/bepisracetests';
    } else {
        alert("logout failed");
    }
};

document.addEventListener('DOMContentLoaded', () => {
    loadusername();
    loadBalance();
});   

window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'loggedout') {
    document.getElementById('errorMessage').style.display = 'block';
    }
};

</script>
</body>
