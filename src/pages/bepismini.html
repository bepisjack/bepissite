<script>
function checkUnlock() {
const releaseDate = new Date('2026-02-15T18:00:00-5:00');


const nowEST = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));

if (nowEST >= releaseDate) {
  const secret = document.getElementById('secret');
  if (secret) {
  secret.hidden = false;
  secret.selected = true;
}
} else {
  setTimeout(checkUnlock, 60000);
}
}

const loadSelectedFile = () => {
document.getElementById("crossword").src = fileSelector.value;

};

const fileSelector= document.getElementById("fileSelector");
fileSelector.addEventListener("change", loadSelectedFile);

checkUnlock();

</script>
