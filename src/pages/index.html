<script>

function updateDailyClock () {
    const releaseDate = new Date('2026-03-20T22:00:00Z').getTime();

    const now = new Date().getTime();

    const diff = releaseDate - now;
    const status = document.getElementById('status');

    if (diff <= 0) {
        status.innerText = "bepis mini crossword #15 now available!!";
        return;
} else {
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    const hDisplay = String(hours).padStart(2, '0');
    const mDisplay = String(mins).padStart(2, '0');
    const sDisplay = String(secs).padStart(2, '0');

    status.innerText = `new bepis mini in ${hDisplay}:${mDisplay}:${sDisplay}`;

    setTimeout(updateDailyClock, 1000);
}
}

    const setRandomImage = function() {
        const images = [
            '/freaky.jpg',
            '/2beers.png',
            '/faded.png',
            '/wizard.png',
            'sip.png',
            '/goblin.png',
            '/beer.png',
            '/beer.png',
            '/beer.png',
            '/beer.png',
            '/beer.png'
        ];

        const randomIndex = Math.floor(Math.random() * images.length);

        document.getElementById('beerpic').src = images[randomIndex];
    }

   const refreshcard = async function() {
    try {
    const response = await fetch('https://bepisbackend.fly.dev/randomcard');
    const data = await response.json();

    const titleObj = data.title;
    const descObj = data.description;

    const allTitles = Object.values(titleObj);
    const allDescs = Object.values(descObj);

    const finalTitle = allTitles[0][0];
    const finalDesc = allDescs[0][0];

    document.getElementById('title').innerText = finalTitle;
    document.getElementById('description').innerText = finalDesc;
    
    }
    catch (error) {
        console.error("Error fetching data", error);
    }
}

  document.addEventListener('DOMContentLoaded', refreshcard);

const refreshTicker = async function() {
    try {
        const response = await fetch('https://bepisbackend.fly.dev/news/news');
        const headlines = await response.json(); 
        
        const ticker = document.getElementById('news-display');

        const content = headlines.map(text => `<span>${text}</span>`).join('');

        ticker.innerHTML = content + content;

        const scrollWidth = ticker.scrollWidth / 2;

        const pixelsPerSecond = 110;
        const duration = scrollWidth / pixelsPerSecond;

        ticker.style.animationDuration = `${duration}s`;
        
    } catch (error) {
        console.error("Ticker failed to load", error);
    }
}

      async function getData2() {
    try {
        const response = await fetch('https://bepisbackend.fly.dev/commits');  // Call your backend endpoint
        
        if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
        }

        const commitCount = await response.json();
        updateStats('ver 1.' + commitCount, null);
    } catch (error) {
        console.error(error.message);
    }
}

      async function getData1() {
    try {
        const response = await fetch('https://bepisbackend.fly.dev/pagecount');  // Call your backend endpoint
        
        if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
        }

        const pagesCount = await response.json();
        updateStats(null, "pages: " + pagesCount);
    } catch (error) {
        console.error(error.message);
    }
}

let currentVer = "..";
let currentPages = "..";

function updateStats(ver, pages) {
    if (ver) currentVer = ver;
    if (pages) currentPages = pages;
    document.getElementById("stats").innerText = `${currentVer} | ${currentPages}`;
}

document.addEventListener('DOMContentLoaded', () => {
    refreshcard();
    refreshTicker();
    setRandomImage();
    getData1();
    getData2();
    updateDailyClock();
});

    </script>
