<script>

    async function uploadPhoto() {
    const uploadedPhoto = document.getElementById('beerPicture');
    const file = uploadedPhoto.files[0];

    const photoData = new FormData();
    photoData.append('image', file);

    try {
        const response = await fetch('https://api.bepisesports.com/beer/pictures', {
             method: 'POST',
            body: photoData,
        });
        const result = await response.json();
        console.log ('result');
    } catch (error) {
        console.error('error');
    }
}
</script>

<script>
window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'invalid') {
    document.getElementById('errorMessage').style.display = 'block';
    }
};

const form = document.querySelector('.form1');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const formData = new FormData(form);

    try {
        const response = await fetch('https://api.bepisesports.com/beer/post', {
            method: 'POST', 
            body: formData,
        });
        if (response.ok) {
            console.log('good');
        }
    } catch (error) {
        console.error('Error:', error);
    }
});



</script>
