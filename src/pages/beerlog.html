<!DOCTYPE html>
<head>

<link rel="preload" as="image" href="/testbg7.png">


<title>logging on</title>
</head>
    <style>
body {
     background: url(/testbg7.png), rgba(0, 0, 0, 0.418);
    background-size: 80%;

}

    font-family: test;

}

    display: flex;

    width: auto;
    justify-content: center;

    flex-direction: column;

    width: 200px;
    align-items: center;
    
}

.beerlabel {
    color: white;
    font-size: 34pt;
    text-shadow: 4px 4px 0px black, 0px 0px 2px black;
}

.beerEntry {
  height: 40px;
    width: 280px;
    background-color: rgba(0, 0, 0, 0.271);
    background-blend-mode: multiply;
    color: white;
    font-family: test2;
    font-size: 26pt;
    text-align: center;
        box-shadow: 2px 2px 0px black;
}

.picEntry {
  height: 40px;
    width: 60vw;
    background-color: rgba(0, 0, 0, 0.271);
    background-blend-mode: multiply;
    color: white;
    font-family: test2;

    text-align: center;
        box-shadow: 2px 2px 0px black;
}


.beerDescription {
    color: white;
    font-size: 28pt;
  text-shadow: 4px 4px 0px black, 0px 0px 2px black;
  line-height: 1.4;
}


.descriptionEntry {
  height: 40px;
    width: 90px;
    background-color: rgba(0, 0, 0, 0.271);
    background-blend-mode: multiply;
    color: white;
    font-family: test2;
    font-size: 26pt;
    text-align: center;
    box-shadow: 2px 2px 0px black;
}

.registerbutton {
    font-family: test2;
    background-color: rgba(0, 0, 0, 0.267);
    color: white;
    cursor: pointer;
    height: 40px;
    width: 100px;
    font-size: 14pt;
    filter: drop-shadow(0px 0px 1px rgb(34, 24, 141));
    border: 2px outset black;
}

.errormessage {
    color: orangered;
    font-size: 24pt;
    width: 400px;
    text-shadow: 2px 2px 0px rgb(0, 0, 0), 0px 0px 2px black;
}

</style>

<body>
    <br><br><br><br><br><br><br><br><br><br><br>
<form class="form1">

<label for="beerName" class="beerlabel">beer</label>

<input type="text" id="beerEntry" name="beerName" class="beerEntry"  required></textarea>

<label for="beerDescription" class="beerDescription">review</label>

<input type="text" id="DescriptionEntry" name="beerDescription" class="descriptionEntry" required></textarea>

<label for="beer name" class="beerlabel">rating</label>

<input type="number" id="beerEntry" name="beerRating" class="beerEntry" min="0" max="5" step="0.25" required></textarea>

<label for="beer name" class="beerlabel">date</label>

<input type="date" id="beerEntry" name="beerDate" class="beerEntry"  required></textarea>

<label for="beer name" class="beerlabel">picture!</label>

<input type="file" id="beerPicture" name="beerPicture" class="picEntry" required></textarea>


<br><br>
<button type="submit" class="registerbutton" id="submitButton">review!</button>
<br>
<div id="errorMessage" class="errormessage" style="color: red; display: none;">invalid review!</div>
</form>


<script>
window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'invalid') {
    document.getElementById('errorMessage').style.display = 'block';
    }
};

const form = document.querySelector('.form1');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const formData = new FormData(form);

    try {
        const response = await fetch('https://api.bepisesports.com/beer/post', {
            method: 'POST', 
            body: formData,
        });
        if (response.ok) {
            console.log('good');
        }
    } catch (error) {
        console.error('Error:', error);
    }

    const refreshChannels = async function() {
    try {
        const response = await fetch('https://api.bepisesports.com/accounts/leaderboard');
        const boardData = await response.json(); 
        boardData.sort((a, b) => b.currency - a.currency);
        const leaderboardDisplay = document.getElementById('leaderboard');
        leaderboardDisplay.innerHTML = " ";

        boardData.forEach(element => {
           const row = document.createElement('p');
           row.className = 'board-log-entry';

           row.innerHTML = `
           <span class="board-user">${element.username}</span> -
           <span class="board-balance">${element.currency}</span> bepiscoin
           `
            leaderboardDisplay.appendChild(row); 
        });

        setTimeout(() => {
            leaderboardDisplay.scrollTop = leaderboardDisplay.scrollHeight;
}, 0);
        if (leaderboardDisplay.scrollHeight - leaderboardDisplay.scrollTop <= leaderboardDisplay.clientHeight + 100) {
    leaderboardDisplay.scrollTop = leaderboardDisplay.scrollHeight;
}
        } catch (err) {
            console.error("could not refresh ticker!". err);
        }
    };    

});



</script>

</body>
