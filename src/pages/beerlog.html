<body>
    <br><br><br><br><br>
<form class="form1">

<label for="beerName" class="beerlabel">beer</label>
<input type="text" id="beerEntry" name="beerName" class="beerEntry"  required></textarea>
<br>
<label for="beerDescription" class="beerDescription">review</label>
<textarea id="DescriptionEntry" name="beerDescription" class="descriptionEntry" required></textarea>
<br>
<label for="beer name" class="beerlabel">rating</label>
<input type="number" id="beerEntry" name="beerRating" class="beerRating" min="0" max="5" step="0.25" required></textarea>
<br>
<label for="beer name" class="beerlabel">date</label>
<input type="date" id="beerEntry" name="beerDate" class="beerDate"  required></textarea>
<br>
<label for="beer name" class="beerlabel">picture!</label>
<input type="file" id="beerPicture" name="beerPicture" class="picEntry" required></textarea>


<br><br>
<button type="submit" class="registerbutton" id="submitButton">review!</button>

<div id="errorMessage" class="errormessage" style="color: red; display: none;">invalid review!</div>
</form>

<a href="https://bepisesports.com/">
    <button id="back">> back</button>
</a>

<a href="https://bepisesports.com/tristanzone">
    <button id="tzone">> tristan zone</button>
</a>


<script>
window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'invalid') {
    document.getElementById('errorMessage').style.display = 'block';
    }
};

const form = document.querySelector('.form1');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const formData = new FormData(form);

    try {
        const response = await fetch('https://api.bepisesports.com/beer/post', {
            method: 'POST', 
            body: formData,
        });
        if (response.ok) {
            console.log('good');
        }
    } catch (error) {
        console.error('Error:', error);
    }
});



</script>

</body>
