async function loadData() {
  try { const response = await fetch(betsthisweek);
        const bets = await response.json(); 
        const betscontainer = document.getElementById('betslog');
        betscontainer.innerHTML = " ";

        bets.forEach(element => {
           const row = document.createElement('p');
           row.className = 'bet-log-entry';

           row.innerHTML = `
           <span class="log-time">[${element.time}]</span>
           <span class="log-user">${element.username}</span>
           bet <span class="log-amount">${element.amount}</span>
           bepiscoin on <span class="log-selection">${element.selection}</span>!
           `
            betscontainer.appendChild(row); 
        });
    } catch (err) {
            console.error("could not refresh ticker!". err);
        }
    };
