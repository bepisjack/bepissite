<!DOCTYPE html>
<style>

.usernamespot {
    background-image: linear-gradient(-90deg, red, orange);
    width: 300px;
    height: 40px;
font-size: 24pt;
clip-path: polygon(00% 00%,
  100% 00%,
  85% 100%,
  00% 100%);
  left: -3vw;
  top: 2vh;
  position:fixed;
}

.currencyspot {
    background-image: linear-gradient(-90deg, red, orange);
    width: 300px;
    height: 28px;
font-size: 16pt;
clip-path: polygon(00% 00%,
  100% 00%,
  88% 100%,
  00% 100%);
  left: -7vw;
  top: 7.5vh;
  position:fixed;
}


#usernameblank {
    color:white;
    text-shadow: 2px 2px 2px black;
    text-align: right;
transform: translate(-16%, 0%);
}

#balanceDisplay {
    color:white;
    text-shadow: 2px 2px 2px black;
    text-align: right;
transform: translate(-13%, -1%);
}

#logoutButton {
    bottom: 2vh;
    right: 1.5vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 1px red;
    height: 22px;
    width: 60px;
}

.shadowcontainer {
    position: fixed;
    width: 0;
    height: 0;
    z-index: 100;
    filter: drop-shadow(5px 5px 4px rgba(0, 0, 0, 0.6));
}



</style>
<body>
<div class="shadowcontainer">
<div class="usernamespot">
<div id="usernameblank">serapher</div>
</div>
</div>

<div class="shadowcontainer">
<div class="currencyspot">
<div id="balanceDisplay">5 bepiscoin</div>
</div>
</div>

<a href="/racelogin">
    <button id="logoutButton">login!!</button>
</a>



</body>
