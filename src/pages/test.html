<!DOCTYPE html>
<style>

.usernamespot {
    background-image: linear-gradient(-90deg, red, orange);
    width: 300px;
    height: 40px;
font-size: 24pt;
clip-path: polygon(00% 00%,
  100% 00%,
  85% 100%,
  00% 100%);
  left: -3vw;
  top: 2vh;
  position:fixed;
}

.currencyspot {
    background-image: linear-gradient(-90deg, red, orange);
    width: 300px;
    height: 28px;
font-size: 16pt;
clip-path: polygon(00% 00%,
  100% 00%,
  88% 100%,
  00% 100%);
  left: -6vw;
  top: 7.5vh;
  position:fixed;
}


#usernameblank {
    color:white;
    text-shadow: 2px 2px 2px black;
    text-align: right;
transform: translate(-18%, 0%);
}

#balanceDisplay {
    color:white;
    text-shadow: 2px 2px 2px black;
    text-align: right;
transform: translate(-18%, 0%);
}

#logoutButton {
    bottom: 2vh;
    right: 1.5vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 1px red;
    height: 22px;
    width: 60px;
    display: none;
}


</style>
<body>
<div class="usernamespot">
<div id="usernameblank">serapher</div>
</div>
<br>
<div class="currencyspot">
<div id="balanceDisplay">5 bepiscoin</div>
</div>


<form action="https://api.bepisesports.com/accounts/logout" method="POST">
<button id="logoutButton" onclick="handleLogout()">logout!</button>



</body>
