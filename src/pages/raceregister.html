<form class="form1" action="https://api.bepisesports.com/accounts/register" method="POST">

<input type="text" id="usernameEntry" name="username" class="usernameentry" maxlength="14" minlength="1" rows="1" required></textarea>

<script>
window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
