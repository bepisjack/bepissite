
<form class="form1" action="https://api.bepisesports.com/accounts/register" method="POST">

<label for="username">username: </label>
<input type="text" id="usernameEntry" name="username" rows="1"></textarea>
<br>
<br>
<label for="pin">pin: </label>
<input type="text" id="pinEntry" name="pin" maxlength="4"></textarea>

<br><br>
<button type="submit" id="submitButton">register!</button>
<br>
<div id="errorMessage" style="color: red; display: none;">username already taken!</div>
</form>

<script>
window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'invalid') {
    document.getElementById('errorMessage').style.display = 'block';
    }
};
</script>
