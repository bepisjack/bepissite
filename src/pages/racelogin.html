
<form class="form1" action="https://api.bepisesports.com/accounts/login" method="POST">

<label for="username">username: </label>
<input text id="usernameEntry" name="username" rows="1"></textarea>
<br>
<br>
<label for="pin">pin: </label>
<input text id="pinEntry" name="pin" maxlength="4"></textarea>

<br><br>
<button type="submit" id="submitButton">login!</button>
<br>
<div id="errorMessage" style="color: red; display: none;">invalid login!</div>
</form>
<script>
window.onload = () => {
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'invalid') {
    document.getElementById('errorMessage').style.display = 'block';
    }
};
</script>
