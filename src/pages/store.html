        for (let i = array.length - 1; i > 0; i--) {

         [array[i], array[j]] = [array[j], array[i]];
      }

        onend: function() {
          currentIndex++;

          if (currentIndex >= playlist.length) {
            currentIndex = 0;
            shuffle(playlist);

          }
           playSong(currentIndex);
        }
      });

      bgm.play();
      bgm.fade(0, 0.1, 4000);
    
      
      };

const userPrefs = async function() {
    try {
        const response = await fetch('https://api.bepisesports.com/preferences', {
            credentials: 'include'
        });

        if (response.ok) {
            const prefs = await response.json(); 
            const pick = prefs.cursor;
            const soundPick = prefs.sound;

            if (pick) {
                let style = document.getElementById('dynamic-cursor');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'dynamic-cursor';
                    document.head.appendChild(style);
                }
                
                style.innerHTML = `
                    * { 
                        cursor: url(/${pick}.cur), auto !important;
                    }
                
                a, button, input[type="image"], .allothers, .back {
                cursor: url(/${pick}2.cur), pointer !important;

        document.getElementById('loginButton').style.display = 'block';
    }
