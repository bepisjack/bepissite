        var currentIndex = 0;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
         [array[i], array[j]] = [array[j], array[i]];
      }
    }

      shuffle(playlist);

     function playSong(index) {

      var songName = playlist[index].replace('/', '').replace('.mp3', '');

      document.getElementById('song-display').innerHTML = content.repeat(6);

      var bgm = new Howl({
        src: [playlist[index]],
        onend: function() {
          currentIndex++;

          if (currentIndex >= playlist.length) {
            currentIndex = 0;
            shuffle(playlist);

          }
           playSong(currentIndex);
        }
      });

      bgm.play();
      bgm.fade(0, 0.1, 4000);
