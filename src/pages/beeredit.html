<!DOCTYPE html>

<body>

<div id="guifier"></div>


<script type="module">
import Guifier from 'https://jsdelivr.net'

document.addEventListener("DOMContentLoaded", function() {

async function refreshChannels() {
    try {
  const response = await fetch('https://api.bepisesports.com/beer/channels', {
            credentials: 'include'
        });
  const rawData = await response.json();

  const params = {
    elementSelector: '#guifier',
    data: JSON.stringify(rawData),
    dataType: 'json'
};

const guifierInstance = new Guifier(params);

} catch (error) {
    console.error("failed to load beer data", error);
    }
}

refreshChannels();

});

</script>
