<!DOCTYPE html>
<body>
<style>

.title {
    font-size: 24pt;
}

#back {
    bottom: 2vh;
    left: 1vw;
    position: fixed;
    border: 1px white;
    background-color: black;
    color: white;
    box-shadow: 2px 2px 0px red;
    height: 22px;
    width: 60px;
    display: block;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.3s ease;
    
}


#back:hover {
    background-color: rgb(236, 41, 41);
    transform: scale(1.1);
}


</style>

<a href="https://bepisesports.com/beerlog/">
    <button id="back">> back</button>
</a>

<div class="title">no griefing please!! only edit your posts</div>

<div id="guifier"></div>

<button type="submit" class="editButton" id="submitButton">submit edits</button>

<div id="theStatusDiv"></div>

<script type="module">
import Guifier from 'https://cdn.jsdelivr.net/npm/guifier/dist/Guifier.js'

let guifier;

document.addEventListener("DOMContentLoaded", function() {

async function refreshChannels() {
    try {
  const response = await fetch('https://api.bepisesports.com/beer/channels', {
            credentials: 'include'
        });
  const rawData = await response.json();

  const wrappedData = { beers: rawData };

  const params = {
    elementSelector: '#guifier',
    data: JSON.stringify(wrappedData),
    dataType: 'json'
};

guifier = new Guifier(params);

} catch (error) {
    console.error("failed to load beer data", error);
    }
}

refreshChannels();

});

const statusDiv = document.getElementById("theStatusDiv");

const submitEdit = document.getElementById("submitButton");

submitEdit.addEventListener('click', async (event) => {
    event.preventDefault();
    if (!guifier) return;

    const guifierOutput = guifier.getData('json');

    const parsedData = JSON.parse(guifierOutput);

    const cleanArray = parsedData.beers;

    const finalPayload = JSON.stringify(cleanArray);

    try {const response = await fetch('https://api.bepisesports.com/beer/edit', {
            method: 'PUT', 
            headers: {
        'Content-Type': 'application/json' 
    },
            body: finalPayload,
        });
        if (response.ok) {
              statusDiv.innerText = "edited!";
        }
    } catch (error) {
        statusDiv.innerText = "failed to edit!";
    }
});


</script>
